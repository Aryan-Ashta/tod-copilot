# Hand-entered public facts about real downtown Houston office buildings (CoStar-shaped fixture input).
# Every value carries the URL it came from; fields without a public source are omitted (they stay missing).
# Primary source: AECOM for Central Houston / Houston Downtown Redevelopment Authority, "Downtown Houston
# Office Conversion Study", November 2023 (figures in it are CoStar-derived, Spring 2023). The URL named in
# docs/11 (centercityphila.org) returned 404 on 2026-11-13; the same PDF is served at the ctycms.com URL below.
# Page numbers are the PDF pages: p.65 = conversion scoring table (Built, RBA); pp.68/73/81 = building profiles;
# p.53 = conversion benchmarking table.
# `extra` holds sourced facts that are not schema fields (the linker may ignore them).
# lonlat = Nominatim (OSM) geocode of the address, retrieved 2026-11-13.
# 1801 Smith St is deliberately excluded (already converted; backtest only, see backend/tests/locales/backtests.yaml).

