- path: Colorado HB 24-1304 parking minimums near transit
  rule: note
  applies_if: {}
  value: Colorado HB 24-1304 bans minimum parking requirements for multifamily residential development and adaptive reuse
    for residential purposes at or partially within applicable transit service areas (within 0.25 mi of qualifying transit
    stations and bus routes) on or after June 30, 2025.
  cite:
    doc_id: co_hb24_1304_signed
    section: 29-36-103. Limitations on minimum parking requirements.
    quote: 'ON OR AFTER JUNE 30, 2025, A MUNICIPALITY SHALL NEITHER ENACT

      NOR ENFORCE LOCAL LAWS THAT ESTABLISH A MINIMUM PARKING

      REQUIREMENT THAT APPLIES TO A LAND USE APPROVAL FOR A MULTIFAMILY

      RESIDENTIAL DEVELOPMENT, ADAPTIVE RE-USE FOR RESIDENTIAL PURPOSES,

      OR ADAPTIVE RE-USE MIXED-USE PURPOSES WHICH INCLUDE AT LEAST FIFTY

      PERCENT OF USE FOR RESIDENTIAL PURPOSES THAT IS WITHIN THE

      MUNICIPALITY, A METROPOLITAN PLANNING ORGANIZATION, AND AT LEAST

      PARTIALLY WITHIN AN APPLICABLE TRANSIT SERVICE AREA.'
