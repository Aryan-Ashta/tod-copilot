# Structured rules for Los Angeles (docs/10-legal-corpus.md). Two paths are evaluated per parcel:
# "SB 79 new construction" (state law, Gov. Code 65912.155 et seq.) and
# "LA Citywide Adaptive Reuse" (LAMC 12.22 A.26, Ord. No. 188793).
# applies_if: {attribute: {operator: value, ...}}; every listed operator must hold.
# A rule whose value is TODO, or whose applies_if references a missing attribute, is "not covered".

# ---------------------------------------------------------------- SB 79 new construction
# Station tier, keyed on the station's mode. Wilshire D Line stations are heavy rail.
- path: SB 79 new construction
  rule: stop_tier
  applies_if: {station_mode: {eq: heavy_rail}}
  value: 1
  cite:
    doc_id: ca_sb79_2025
    section: Gov. Code § 65912.156
    quote: "“Tier 1 transit-oriented development stop” means a transit-oriented development stop within an urban transit county served by heavy rail transit or very high frequency commuter rail."

- path: SB 79 new construction
  rule: stop_tier
  applies_if: {station_mode: {eq: light_rail}}
  value: 2
  cite:
    doc_id: ca_sb79_2025
    section: Gov. Code § 65912.156
    quote: "“Tier 2 transit-oriented development stop” means a transit-oriented development stop within an urban transit county, excluding a Tier 1 transit-oriented development stop, served by light rail transit, by high-frequency commuter rail, or by bus service meeting the standards of paragraph (1) of subdivision (a) of Section 21060.2 of the Public Resources Code."

# Eligibility: within one-half mile of a Tier 1 or Tier 2 stop. The statute also requires a site
# zoned for residential, mixed, or commercial development; LA zone strings are not matched here.
- path: SB 79 new construction
  rule: eligible
  applies_if: {distance_to_stop_mi: {lte: 0.5}, stop_tier: {in: [1, 2]}}
  value: true
  cite:
    doc_id: ca_sb79_2025
    section: Gov. Code § 65912.157
    quote: "A housing development project shall be an allowed use as a transit-oriented housing development on any site zoned for residential, mixed, or commercial development within one-half or one-quarter mile of a transit-oriented development stop, if the development complies with the applicable of all of the following requirements:"

- path: SB 79 new construction
  rule: eligible
  applies_if: {distance_to_stop_mi: {gte: 0.501}}
  value: false
  cite:
    doc_id: ca_sb79_2025
    section: Gov. Code § 65912.157
    quote: "A housing development project shall be an allowed use as a transit-oriented housing development on any site zoned for residential, mixed, or commercial development within one-half or one-quarter mile of a transit-oriented development stop, if the development complies with the applicable of all of the following requirements:"

# Housing development projects under SB 79 exclude any hotel or transient-lodging portion.
- path: SB 79 new construction
  rule: allows_uses
  applies_if: {}
  value: [residential]
  cite:
    doc_id: ca_sb79_2025
    section: Gov. Code § 65912.156
    quote: "“Housing development project” has the same meaning as defined in Section 65589.5, but does not include a project of which any portion is designated for use as a hotel, motel, bed and breakfast inn, or other transient lodging."

# SB 79 projects use the Gov. Code 65913.4 streamlined, ministerial process (65912.159), whose subdivision (c)
# names one approval: the local government approves the development once the planning director finds it
# consistent with the objective standards. (A notice of intent / tribal scoping consultation precedes the
# application; it is not an approval.)
- path: SB 79 new construction
  rule: approval_steps
  applies_if: {}
  value: 1
  cite:
    doc_id: ca_gov_code_65913_4
    section: Gov. Code § 65913.4(c)
    quote: "(c) (1) Notwithstanding any local law, if a local government’s planning director or equivalent position determines that a development submitted pursuant to this section is consistent with the objective planning standards specified in subdivision (a) and pursuant to paragraph (3) of this subdivision, the local government shall approve the development."

- path: SB 79 new construction
  rule: discretionary
  applies_if: {}
  value: false
  cite:
    doc_id: ca_sb79_2025
    section: Gov. Code § 65912.159
    quote: "A housing development project proposed pursuant to Section 65912.157 shall be eligible for streamlined ministerial approval pursuant to Section 65913.4 in accordance with all of the following:"

# Height / density / residential FAR floors by tier and distance band (Gov. Code 65912.157(a)(3)-(6)).
# The outer bands (>1/4 mi to 1/2 mi) apply in cities of at least 35,000 people (Los Angeles qualifies).
- path: SB 79 new construction
  rule: max_height_ft
  applies_if: {distance_to_stop_mi: {lte: 0.25}, stop_tier: {eq: 1}}
  value: 75
  cite:
    doc_id: ca_sb79_2025
    section: Gov. Code § 65912.157
    quote: "A local government shall not impose any height limit less than 75 feet."

- path: SB 79 new construction
  rule: max_units_per_acre
  applies_if: {distance_to_stop_mi: {lte: 0.25}, stop_tier: {eq: 1}}
  value: 120
  cite:
    doc_id: ca_sb79_2025
    section: Gov. Code § 65912.157
    quote: "A local government shall not impose any maximum density of less than 120 dwelling units per acre."

- path: SB 79 new construction
  rule: max_far
  applies_if: {distance_to_stop_mi: {lte: 0.25}, stop_tier: {eq: 1}}
  value: 3.5
  cite:
    doc_id: ca_sb79_2025
    section: Gov. Code § 65912.157
    quote: "A local government shall not enforce any other local development standard or combination of standards that would physically preclude achieving a residential floor area ratio of up to 3.5."

- path: SB 79 new construction
  rule: max_height_ft
  applies_if: {distance_to_stop_mi: {gte: 0.25, lte: 0.5}, stop_tier: {eq: 1}}
  value: 65
  cite:
    doc_id: ca_sb79_2025
    section: Gov. Code § 65912.157
    quote: "A local government shall not impose any height limit less than 65 feet."

- path: SB 79 new construction
  rule: max_units_per_acre
  applies_if: {distance_to_stop_mi: {gte: 0.25, lte: 0.5}, stop_tier: {eq: 1}}
  value: 100
  cite:
    doc_id: ca_sb79_2025
    section: Gov. Code § 65912.157
    quote: "A local government shall not impose any maximum density standard of less than 100 dwelling units per acre."

- path: SB 79 new construction
  rule: max_far
  applies_if: {distance_to_stop_mi: {gte: 0.25, lte: 0.5}, stop_tier: {eq: 1}}
  value: 3
  cite:
    doc_id: ca_sb79_2025
    section: Gov. Code § 65912.157
    quote: "A local government shall not enforce any other local development standard or combination of standards that would physically preclude achieving a residential floor area ratio of up to 3."

- path: SB 79 new construction
  rule: max_height_ft
  applies_if: {distance_to_stop_mi: {lte: 0.25}, stop_tier: {eq: 2}}
  value: 65
  cite:
    doc_id: ca_sb79_2025
    section: Gov. Code § 65912.157
    quote: "A local government shall not impose any height limit less than 65 feet."

- path: SB 79 new construction
  rule: max_units_per_acre
  applies_if: {distance_to_stop_mi: {lte: 0.25}, stop_tier: {eq: 2}}
  value: 100
  cite:
    doc_id: ca_sb79_2025
    section: Gov. Code § 65912.157
    quote: "A local government shall not impose any maximum density standard of less than 100 dwelling units per acre."

- path: SB 79 new construction
  rule: max_far
  applies_if: {distance_to_stop_mi: {lte: 0.25}, stop_tier: {eq: 2}}
  value: 3
  cite:
    doc_id: ca_sb79_2025
    section: Gov. Code § 65912.157
    quote: "A local government shall not enforce any other local development standard or combination of standards that would physically preclude achieving a residential floor area ratio of up to 3."

- path: SB 79 new construction
  rule: max_height_ft
  applies_if: {distance_to_stop_mi: {gte: 0.25, lte: 0.5}, stop_tier: {eq: 2}}
  value: 55
  cite:
    doc_id: ca_sb79_2025
    section: Gov. Code § 65912.157
    quote: "A local government shall not impose any height limit less than 55 feet."

- path: SB 79 new construction
  rule: max_units_per_acre
  applies_if: {distance_to_stop_mi: {gte: 0.25, lte: 0.5}, stop_tier: {eq: 2}}
  value: 80
  cite:
    doc_id: ca_sb79_2025
    section: Gov. Code § 65912.157
    quote: "A local government shall not impose any maximum density standard of less than 80 dwelling units per acre."

- path: SB 79 new construction
  rule: max_far
  applies_if: {distance_to_stop_mi: {gte: 0.25, lte: 0.5}, stop_tier: {eq: 2}}
  value: 2.5
  cite:
