    section: Gov. Code § 65912.157
    quote: "A local government shall not enforce any other local development standard or combination of standards that would physically preclude achieving a residential floor area ratio of up to 2.5."

# Gov. Code 65863.2(a): no minimum parking within one-half mile of public transit ("major transit stop",
# PRC 21155, which includes a rail station). Distance is to the locale's rail stations. 65863.2(b) lets a city
# impose minimums only on written findings, which (c) bars for projects with 20% affordable units or < 20 units.
- path: SB 79 new construction
  rule: parking_min_per_unit
  applies_if: {distance_to_stop_mi: {lte: 0.5}}
  value: 0
  cite:
    doc_id: ca_gov_code_65863_2
    section: Gov. Code § 65863.2
    quote: "(a) A public agency shall not impose or enforce any minimum automobile parking requirement on a residential, commercial, or other development project if the project is located within one-half mile of public transit."

- path: SB 79 new construction
  rule: note
  applies_if: {}
  value: "lower-income set-aside required for projects over 10 units: 7% extremely low, 10% very low, or 13% lower income"
  cite:
    doc_id: ca_sb79_2025
    section: Gov. Code § 65912.157
    quote: "(iii) At least 13 percent of the total units, as defined in subparagraph (A) of paragraph (9) of subdivision (o) of Section 65915, are dedicated to lower income households, as defined in Section 50079.5 of the Health and Safety Code."

# ---------------------------------------------------------------- LA Citywide Adaptive Reuse
# Eligible: non-residential building at least 15 years old producing five or more units (by right),
# or 5 to <15 years old with a Class 1 Conditional Use Permit, or a parking building at least 5 years old.
# Zone list in 12.22 A.26.(e) is not matched (LA zone strings are not supplied as list members).
- path: LA Citywide Adaptive Reuse
  rule: eligible
  applies_if: {property_type: {in: [office, retail, hotel, industrial, parking_garage]}, building_age_years: {gte: 15}, est_units: {gte: 5}}
  value: true
  cite:
    doc_id: la_adaptive_reuse_2026
    section: Sec. 12.22 A.26.(e)
    quote: "(1) Buildings constructed according to the building and zoning codes in effect at the time they were constructed, for which at least 15 years have elapsed since the date of permitted and completed construction."

- path: LA Citywide Adaptive Reuse
  rule: eligible
  applies_if: {property_type: {eq: parking_garage}, building_age_years: {gte: 5}, est_units: {gte: 5}}
  value: true
  cite:
    doc_id: la_adaptive_reuse_2026
    section: Sec. 12.22 A.26.(e)
    quote: "(3) Any parking building, or parking area within an existing building, constructed according to the building and zoning codes in effect at the time they were constructed, for which at least five years have elapsed since the date of permitted and completed construction."

- path: LA Citywide Adaptive Reuse
  rule: eligible
  applies_if: {property_type: {in: [office, retail, hotel, industrial]}, building_age_years: {gte: 5, lte: 14.99}, est_units: {gte: 5}}
  value: true
  cite:
    doc_id: la_adaptive_reuse_2026
    section: Sec. 12.22 A.26.(e)
    quote: "(2) Buildings constructed according to the building and zoning codes in effect at the time they were constructed, for which at least five years, but less than 15 years, have elapsed since the date of permitted and completed construction, if the Adaptive Reuse Project is approved pursuant to Section 12.24 X.1.(c) and Section 13B.2.1. (Class 1 Conditional Use Permit) of this Code."

- path: LA Citywide Adaptive Reuse
  rule: eligible
  applies_if: {est_units: {lte: 4}}
  value: false
  cite:
    doc_id: la_adaptive_reuse_2026
    section: Sec. 12.22 A.26.(d)
    quote: "(4) Only an Adaptive Reuse Project that results in five or more residential units that meet the definition of Residential Use defined in this subdivision, shall be eligible for the incentives and procedures in this subdivision."

- path: LA Citywide Adaptive Reuse
  rule: eligible
  applies_if: {building_age_years: {lte: 4.99}}
  value: false
  cite:
    doc_id: la_adaptive_reuse_2026
    section: Sec. 12.22 A.26.(e)
    quote: "(3) Any parking building, or parking area within an existing building, constructed according to the building and zoning codes in effect at the time they were constructed, for which at least five years have elapsed since the date of permitted and completed construction."

- path: LA Citywide Adaptive Reuse
  rule: eligible
  applies_if: {property_type: {eq: residential}}
  value: false
  cite:
    doc_id: la_adaptive_reuse_2026
    section: Sec. 12.22 A.26.(d)
    quote: "(1) In all or any portion of an eligible building or parking building, a change of use is allowed from an existing Non-Residential Use or Hotel, excluding a Residential Hotel or Residential Unit as defined in Section 47.73 of this Code, to a new Residential Use."

# Residential conversion, keeping active ground-floor commercial space (12.22 A.26.(d)(5), (h)(15)).
# Conversion to hotel is limited to the Adaptive Reuse Subareas with a Class 3 CUP, so it is not listed.
- path: LA Citywide Adaptive Reuse
  rule: allows_uses
  applies_if: {}
  value: [residential, mixed_use]
  cite:
    doc_id: la_adaptive_reuse_2026
    section: Sec. 12.22 A.26.(d)
    quote: "(1) In all or any portion of an eligible building or parking building, a change of use is allowed from an existing Non-Residential Use or Hotel, excluding a Residential Hotel or Residential Unit as defined in Section 47.73 of this Code, to a new Residential Use."

# Buildings 15+ years old: building permit review only (one approval: the building permit).
- path: LA Citywide Adaptive Reuse
  rule: approval_steps
  applies_if: {building_age_years: {gte: 15}}
  value: 1
  cite:
    doc_id: la_adaptive_reuse_2026
    section: Sec. 12.22 A.26.(f)
    quote: "(1) Building Permit Review. For purposes of this section, the following Adaptive Reuse Projects that seek incentives described in Section 12.22 A.26.(h) shall be issued building permits if they comply with this subdivision and all other applicable requirements under the Code:"

- path: LA Citywide Adaptive Reuse
  rule: discretionary
  applies_if: {building_age_years: {gte: 15}}
  value: false
  cite:
    doc_id: la_adaptive_reuse_2026
    section: Sec. 12.22 A.26.(f)
    quote: "(1) Building Permit Review. For purposes of this section, the following Adaptive Reuse Projects that seek incentives described in Section 12.22 A.26.(h) shall be issued building permits if they comply with this subdivision and all other applicable requirements under the Code:"

# Buildings 5 to <15 years old: two approvals, the Zoning Administrator's Class 1 Conditional Use
# (LAMC 12.24 X.1, the initial decision; the Area Planning Commission hears appeals) and then the
# building permit (12.22 A.26.(f)).
- path: LA Citywide Adaptive Reuse
  rule: approval_steps
  applies_if: {building_age_years: {gte: 5, lte: 14.99}}
  value: 2
  cite:
    doc_id: la_lamc_12_24_x1
    section: Sec. 12.24 X.1.
    quote: "The following uses and activities may be allowed in any zone, unless otherwise restricted to certain zones or locations, if approved by the Zoning Administrator as the initial decision maker or the Area Planning Commission as the appellate body."

- path: LA Citywide Adaptive Reuse
  rule: discretionary
  applies_if: {building_age_years: {gte: 5, lte: 14.99}}
  value: true
  cite:
    doc_id: la_adaptive_reuse_2026
    section: Sec. 12.22 A.26.(f)
    quote: "The Zoning Administrator shall review and approve the following Adaptive Reuse Projects pursuant to Section 12.24 X.1. and Section 13B.2.1. (Class 1 Conditional Use Permit) of Chapter 1A of this Code:"

# Within one-half mile of a rail station, Gov. Code 65863.2(a) bars any minimum parking requirement.
- path: LA Citywide Adaptive Reuse
  rule: parking_min_per_unit
  applies_if: {distance_to_stop_mi: {lte: 0.5}}
  value: 0
  cite:
    doc_id: ca_gov_code_65863_2
    section: Gov. Code § 65863.2
    quote: "(a) A public agency shall not impose or enforce any minimum automobile parking requirement on a residential, commercial, or other development project if the project is located within one-half mile of public transit."

# Farther out, required parking equals the spaces that physically exist today: not a per-unit ratio.
- path: LA Citywide Adaptive Reuse
  rule: parking_min_per_unit
  applies_if: {}
  value: TODO
  cite:
    doc_id: la_adaptive_reuse_2026
    section: Sec. 12.22 A.26.(h)
    quote: "The required number of parking spaces shall be the same as the number of spaces that are observed to physically exist on the site at the time of application submittal for the Adaptive Reuse Project."

- path: LA Citywide Adaptive Reuse
  rule: note
  applies_if: {}
  value: "no lot-area-per-unit density limit; existing height and floor area may remain"
  cite:
    doc_id: la_adaptive_reuse_2026
    section: Sec. 12.22 A.26.(h)
    quote: "(3) Density. New Residential Uses shall not be subject to the minimum lot area per Dwelling Unit requirements, or minimum lot area per Guest Room requirements, of the zone in which they are located."
