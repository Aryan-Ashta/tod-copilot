# Structured rules for Brevard / Cocoa (docs/10-legal-corpus.md).
# Governing code: City of Cocoa Code of Ordinances, Appendix A (Zoning). 713 of 781 county parcels within
# 0.5 mi of the planned Brightline station report CITY = COCOA, and the station-area parcels (Brightline,
# Walmart, city land) are mapped in the City of Cocoa zoning layer. Unincorporated pockets (Brevard
# County zoning RU-1-13, EU, EU-2, RU-1-9, RU-1-11, GML, TU-1) are not covered: those parcels get eligible = None.
# Cocoa single-family districts (RE, RR-1, RU-1-7, RU-1-7a) permit "One single-family dwelling" per lot and state
# minimum lot areas but no units-per-acre density, and PUD density is set per PUD by City Council: their
# eligibility stays not covered (None) and they carry a note rule instead.
# zoning_code values are the `Zoning` field of the City of Cocoa zoning layer:
# https://services1.arcgis.com/Tex1uhbqnOZPx6qT/arcgis/rest/services/Public_View_Cocoa_Zoning_with_Split_Lots_June_2023_view/FeatureServer/1
# No adopted Brightline station-area overlay was found (layer fields FurtherRestrictions/RestrictionURL are empty there;
# the Four Corners Overlay District at SR 520 / US 1, Ord. 02-2025, had only a first reading on 2026-11-10 and is
# not at the station). The city's two CRAs (Diamond Square: Pineda St, School St, FEC railroad, Rosa L. Jones Dr;
# Cocoa CRA: Mitchell St to Rosa L. Jones Dr east of the FEC, per https://www.cocoafl.gov/1726 and the 2025 CRA
# annual report) lie south of the station area, judging by those street boundaries.
#
# Second path, "Florida Live Local Act" (F.S. 166.04151(7), florida/ corpus): multifamily and mixed-use residential
# must be allowed in Cocoa's commercial and industrial districts. Its density ("highest currently allowed ... on any
# land in the municipality") and height ("highest ... within 1 mile ... or three stories") are not numbers in the
# corpus, so those rules stay TODO.

