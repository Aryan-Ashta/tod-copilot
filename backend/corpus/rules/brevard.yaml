# Structured rules for Brevard / Cocoa (docs/10-legal-corpus.md).
# Governing code: City of Cocoa Code of Ordinances, Appendix A (Zoning). 713 of 781 county parcels within
# 0.5 mi of the planned Brightline station report CITY = COCOA, and the station-area parcels (Brightline,
# Walmart, city land) are mapped in the City of Cocoa zoning layer. Unincorporated pockets (Brevard
# County zoning RU-1-13, EU, EU-2, RU-1-9, RU-1-11, GML, TU-1) and Cocoa single-family districts are not
# covered: those parcels get eligible = None.
# zoning_code values are the `Zoning` field of the City of Cocoa zoning layer:
# https://services1.arcgis.com/Tex1uhbqnOZPx6qT/arcgis/rest/services/Public_View_Cocoa_Zoning_with_Split_Lots_June_2023_view/FeatureServer/1
# No adopted Brightline station-area overlay was found (layer fields FurtherRestrictions/RestrictionURL are empty there).

# ---------------------------------------------------------------- eligibility (multi-family homes)
- path: City of Cocoa land development code
  rule: eligible
  applies_if: {zoning_code: {eq: RU-2-15}}
  value: true
  cite:
    doc_id: cocoa_zoning_code
    section: App. A, Art. XI, Sec. 5
    quote: "Multiple-family dwellings (four (4) or more units per building) not more than fifteen (15) dwelling units per acre (two thousand nine hundred (2,900) square feet of lot per dwelling unit) for multi-storied structures."

- path: City of Cocoa land development code
  rule: eligible
  applies_if: {zoning_code: {eq: RU-2-25}}
  value: true
  cite:
    doc_id: cocoa_zoning_code
    section: App. A, Art. XI, Sec. 6
    quote: "Multiple-family dwellings (five (5) or more units per building)."

- path: City of Cocoa land development code
  rule: eligible
  applies_if: {zoning_code: {eq: C-N}}
  value: true
  cite:
    doc_id: cocoa_zoning_code
    section: App. A, Art. XI, Sec. 11
    quote: "Multiple-family and single-family residences as regulated in section 5, RU-2-15 District."

- path: City of Cocoa land development code
  rule: eligible
  applies_if: {zoning_code: {eq: C-R}}
  value: true
  cite:
    doc_id: cocoa_zoning_code
    section: App. A, Art. XI, Sec. 10A
    quote: "Multiple-family and single-family residences as regulated in section 5, RU-2-15."

