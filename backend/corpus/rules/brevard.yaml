# ---------------------------------------------------------------- Florida Live Local Act (F.S. 166.04151(7))
# Cocoa's commercial (C-G, C-N, C-R, C-P, C-W) and industrial (M-2) districts. Residential districts are left
# not covered rather than ineligible: the Act also reaches property owned by a county, municipality or school
# district, and ownership is not a zoning attribute.
- path: Florida Live Local Act
  rule: eligible
  applies_if: {zoning_code: {in: [C-G, C-N, C-R, C-P, C-W, M-2]}}
  value: true
  cite:
    doc_id: fl_stat_166_04151
    section: F.S. 166.04151(7)(a)
    quote: "A municipality must authorize multifamily and mixed-use residential as allowable uses in any area zoned for commercial, industrial, or mixed use;"

- path: Florida Live Local Act
  rule: allows_uses
  applies_if: {}
  value: [residential, mixed_use]
  cite:
    doc_id: fl_stat_166_04151
    section: F.S. 166.04151(7)(a)
    quote: "A municipality must authorize multifamily and mixed-use residential as allowable uses in any area zoned for commercial, industrial, or mixed use;"

# One approval, named: administrative approval with no board or council action.
- path: Florida Live Local Act
  rule: approval_steps
  applies_if: {}
  value: 1
  cite:
    doc_id: fl_stat_166_04151
    section: F.S. 166.04151(7)(e)
    quote: "A proposed development authorized under this subsection must be administratively approved without further action by the governing body of the municipality or any quasi-judicial or administrative board or reviewing body if the development satisfies the municipality’s land development regulations for multifamily developments in areas zoned for such use and is otherwise consistent with the comprehensive plan, with the exception of provisions establishing allowable densities, floor area ratios, height, and land use."

- path: Florida Live Local Act
  rule: discretionary
  applies_if: {}
  value: false
  cite:
    doc_id: fl_stat_166_04151
    section: F.S. 166.04151(7)(a)
    quote: "Notwithstanding any other law, local ordinance, or regulation to the contrary, a municipality may not require a proposed multifamily development to obtain a zoning or land use change, special exception, conditional use approval, variance, transfer of density or development units, amendment to a development of regional impact, amendment to a municipal charter, or comprehensive plan amendment for the building height, zoning, and densities authorized under this subsection."

# The floor is Cocoa's highest allowed density anywhere in the city; that city-wide maximum is not in the corpus.
- path: Florida Live Local Act
  rule: max_units_per_acre
  applies_if: {}
  value: TODO
  cite:
    doc_id: fl_stat_166_04151
    section: F.S. 166.04151(7)(b)
    quote: "A municipality may not restrict the density of a proposed development authorized under this subsection below the highest currently allowed, or allowed on July 1, 2023, density on any land in the municipality where residential development is allowed under the municipality’s land development regulations."

# The floor is the tallest allowed commercial/residential height within 1 mile, or three stories (not feet).
- path: Florida Live Local Act
  rule: max_height_ft
  applies_if: {}
  value: TODO
  cite:
    doc_id: fl_stat_166_04151
    section: F.S. 166.04151(7)(d)
    quote: "A municipality may not restrict the height of a proposed development authorized under this subsection below the highest currently allowed, or allowed on July 1, 2023, height for a commercial or residential building located in its jurisdiction within 1 mile of the proposed development or three stories, whichever is higher."

# "Affordable" per F.S. 420.0004(3): housing costs at most 30% of income for the income groups in 420.0004(9),
# (11), (12) and (17), the highest being moderate income (< 120% of median, 420.0004(12)).
- path: Florida Live Local Act
  rule: note
  applies_if: {zoning_code: {in: [C-G, C-N, C-R, C-P, C-W, M-2]}}
  value: "at least 40% of units must be rental units affordable (as defined in F.S. 420.0004) for at least 30 years"
  cite:
    doc_id: fl_stat_166_04151
    section: F.S. 166.04151(7)(a)
    quote: "if at least 40 percent of the residential units in a proposed multifamily development are rental units that, for a period of at least 30 years, are affordable as defined in s. 420.0004."
