# Art. XIII, Sec. 1(B): any development other than a single-family home or single duplex needs site plan approval
# before a building permit (2 approvals). P-S and C-P allow multi-family only as a special exception, which the
# same sentence names as a third, prior approval.
- path: City of Cocoa land development code
  rule: approval_steps
  applies_if: {zoning_code: {in: [P-S, C-P]}}
  value: 3
  cite:
    doc_id: cocoa_site_plan
    section: App. A, Art. XIII, Sec. 1
    quote: "Except for single family homes or a single duplex unit, any development, change of use, any use approved as a special exception, mobile home parks, and mobile home cooperatives shall require a site plan approval prior to the issuance of any building permit."

- path: City of Cocoa land development code
  rule: approval_steps
  applies_if: {zoning_code: {in: [RU-2-15, RU-2-25, C-N, C-R]}}
  value: 2
  cite:
    doc_id: cocoa_site_plan
    section: App. A, Art. XIII, Sec. 1
    quote: "Except for single family homes or a single duplex unit, any development, change of use, any use approved as a special exception, mobile home parks, and mobile home cooperatives shall require a site plan approval prior to the issuance of any building permit."

