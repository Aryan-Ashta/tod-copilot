    - "Houston Chronicle 2024: 'Quinlan first moved out the remaining tenants and sold the tower to DeBartolo vacant' (acquired in 2021 'when it was less than 30% occupied'); vacancy_pct 100 = state at DeBartolo's 2022 purchase."

