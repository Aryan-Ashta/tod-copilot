    - "RNR 2024-02-01: 'At 20 stories, 1801 Smith is a 458,000-square-foot tower with parking.'"
    - "RNR 2024-02-01: 'the 1971 building – previously known as 600 Jefferson – features 372 swank units'. Year conflicts: RNR 2023-12-20 says ''60s vintage'; AECOM 2023 p.53 lists Year Built 1972."
