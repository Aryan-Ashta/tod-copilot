# Raw county land-use codes -> TOD Copilot vocabulary (plan Phase 2 step 10).
# Vocabulary: surface_parking | vacant | retail_1story | office | retail | hotel | industrial | parking_garage | residential | public | other
# Overlays applied after this map (backend/agents/common.py classify step):
#   - surface_parking when OSM surface parking covers >= 50% of the parcel's area
#   - retail_1story when the use is retail and the tallest building on the parcel has <= 1 story
houston_downtown:
  field: raw_use
  source_url: https://hcad.org/hcad-resources/hcad-appraisal-codes/
  note: HCAD state class codes. F1 'Real, Commercial' does not separate office from retail; it maps to retail and buildings refine it.
  building_type_reliable: false  # do not give buildings a property_type from these codes
  default: other
  map:
    A1: residential
    A2: residential
    A3: residential
    A4: residential
    B1: residential
    B2: residential
    B3: residential
    B4: residential
    O1: residential
    C1: vacant
    C2: vacant
    C3: vacant
    F1: retail
    F2: industrial
    HH: residential
    J1: public
    J2: public
    J3: public
    J4: public
    J5: public
    J6: public
    J7: public
    X1: public
    X2: public
    X3: other
    X4: public
    XE: public
    XG: public
    XI: public
    XJ: public
    XV: public
