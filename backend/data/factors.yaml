vmt_reduction_per_household_near_transit:
  value:
    houston_downtown: 1884
    la_wilshire_koreatown: 1884
    brevard_cocoa: 869
  unit: miles/household/year
  source_url: https://ww2.arb.ca.gov/sites/default/files/2025-09/Residential%20Transit%20Access%20-%202025%20Policy%20Brief.pdf
  verified: false
  note: "CARB policy brief 'Impacts of Residential Transit Access (Distance to Transit)' (Volker, UC Davis, Apr 2025), review of the empirical literature: 'Two separate meta-analyses ... estimated an elasticity of VMT with respect to transit proximity of -0.05' (Ewing & Cervero 2010; Stevens 2017), and 'the maximum total effect of rail transit proximity is more than double that of bus stop proximity (13% versus 6% reduction in VMT)' (Bailey et al. 2008: -4.3% per mile within 3 mi of rail; -1.5% per 1/4 mi within 1 mi of a bus stop). Baseline: FHWA Summary of Travel Trends, 2022 NHTS https://www.fhwa.dot.gov/policyinformation/2022Summary_of_Travel_Trends_Report.pdf, Table 3-4 average annual VMT per household (all purposes) 2022 = 14,489. Houston and LA (sites limited to rail station areas): 0.13 x 14,489 = 1,884. Brevard (no operating rail; planned Brightline is intercity): bus maximum 0.06 x 14,489 = 869. Controlled cross-sectional estimates, not causal; NHTS survey VMT runs below external VMT totals, so the baseline is conservative."
